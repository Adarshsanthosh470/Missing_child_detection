<!DOCTYPE html>
<html>
<head>
    <title>Upload Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-10">

<div class="max-w-xl mx-auto bg-white p-8 shadow-lg rounded-lg">
    <h1 class="text-2xl font-bold mb-4">Upload Social Media Post</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Your name"
               class="block w-full mb-4 p-2 border rounded">

        <textarea name="caption" placeholder="Write a caption..."
                  class="block w-full mb-4 p-2 border rounded"></textarea>

        <input type="file" name="image" accept="image/*"
               class="block mb-4">

        <button class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">
            Upload
        </button>
    </form>
</div>

</body>
</html>
